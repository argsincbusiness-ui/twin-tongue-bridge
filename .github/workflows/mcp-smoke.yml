name: MCP endpoint smoke test

on:
  push:
    branches:
      - feat/chatgpt-mcp-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel preview alias
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "https://twin-tongue-bridge-git-fe-947230-argsincbusiness-3593s-projects.vercel.app/mcp/health" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              break
            fi
            sleep 10
          done
          test "$code" = "200"
      - name: Verify OAuth protected-resource metadata
        run: |
          curl --fail-with-body -sS "https://twin-tongue-bridge-git-fe-947230-argsincbusiness-3593s-projects.vercel.app/.well-known/oauth-protected-resource/mcp" -o /tmp/resource.json
          cat /tmp/resource.json
          grep -q 'nyjcsedhyqpriskjzwhd.supabase.co/auth/v1' /tmp/resource.json
          grep -q 'authorization_servers' /tmp/resource.json
      - name: Verify unauthenticated MCP requests are challenged
        run: |
          code=$(curl -sS -D /tmp/mcp.headers -o /tmp/mcp.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -X POST 'https://twin-tongue-bridge-git-fe-947230-argsincbusiness-3593s-projects.vercel.app/mcp' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-actions-smoke","version":"1.0.0"}}}')
          cat /tmp/mcp.json
          test "$code" = "401"
          grep -qi 'www-authenticate: Bearer' /tmp/mcp.headers
          grep -q 'oauth-protected-resource/mcp' /tmp/mcp.headers
