name: MCP production smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production MCP health endpoint
        env:
          MCP_URL: https://twin-tongue-bridge.vercel.app
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$MCP_URL/mcp/health")
          cat /tmp/health.json
          test "$code" = "200"

      - name: Verify production OAuth protected-resource metadata
        env:
          MCP_URL: https://twin-tongue-bridge.vercel.app
        run: |
          set -euo pipefail
          curl --fail-with-body -sS "$MCP_URL/.well-known/oauth-protected-resource/mcp" -o /tmp/resource.json
          cat /tmp/resource.json
          grep -q 'nyjcsedhyqpriskjzwhd.supabase.co/auth/v1' /tmp/resource.json
          grep -q 'authorization_servers' /tmp/resource.json

      - name: Verify unauthenticated MCP requests are challenged
        env:
          MCP_URL: https://twin-tongue-bridge.vercel.app
        run: |
          set -euo pipefail
          code=$(curl -sS -D /tmp/mcp.headers -o /tmp/mcp.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -X POST "$MCP_URL/mcp" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-actions-smoke","version":"1.0.0"}}}')
          cat /tmp/mcp.json
          test "$code" = "401"
          grep -qi 'www-authenticate: Bearer' /tmp/mcp.headers
          grep -q 'oauth-protected-resource/mcp' /tmp/mcp.headers

      - name: Report authenticated translation test requirement
        if: always()
        run: |
          echo "Production health, OAuth metadata, and unauthenticated auth challenge are checked here."
          echo "A real translate_text call requires a dedicated test user's Supabase access token; never use a personal token."
          echo "Configure MCP_TEST_ACCESS_TOKEN as a GitHub Actions secret and add an authenticated tools/call step before treating MCP translation as verified."
